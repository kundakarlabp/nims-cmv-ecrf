<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Connect NIMS CMV to ChatGPT</title>
<style>body{font:17px system-ui;background:#f3f6f8;color:#183046;margin:0}main{max-width:480px;margin:6vh auto;padding:26px;background:white;border-radius:18px}label{display:block;margin:14px 0}input:not([type=checkbox]),button{font:inherit;padding:12px;box-sizing:border-box;width:100%;margin-top:7px}button{background:#086c63;color:white;border:0;border-radius:8px;cursor:pointer}small{display:block;margin:12px 0}#message{color:#a12222}a{color:#075f73}</style>
<main><h1>Connect NIMS CMV</h1><p>Link your dashboard account to ChatGPT.</p>
<form id="login" hidden><label>Dashboard username<input name="username" autocomplete="username" required></label><label>Password<input name="password" type="password" autocomplete="current-password" required></label><label>Authenticator code, if enabled<input name="otp" autocomplete="one-time-code"></label><button>Sign in</button></form>
<section id="consent" hidden><p id="identity"></p><label><input type="checkbox" checked disabled> Read matching participant records</label><label id="write-option"><input id="write" type="checkbox"> Save and correct records when requested</label><small>Selected records will be returned to ChatGPT. Changes use your dashboard permissions and are attributed to your account.</small><button id="approve">Authorize connection</button></section>
<section id="connections" hidden><p>Manage your ChatGPT connections. Revocation immediately rejects their tokens.</p><div id="connection-list"></div></section>
<p id="message" role="status"></p><p><a href="/">Return to dashboard</a></p></main><script src="/oauth-ui.js" defer></script></html>
