name: Encrypted clinical backup
on:
  schedule:
    # UTC: 07:47, 10:47, 13:47 and 16:47 India time. No overnight schedule.
    - cron: '17 2,5,8,11 * * *'
  workflow_dispatch:
permissions:
  contents: write
  id-token: write
  actions: read
jobs:
  backup:
    concurrency:
      group: encrypted-clinical-backup
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Retrieve encrypted archive using scoped workflow identity
        run: python3 ops/transfer_clinical_backup.py fetch
      - name: Save to private recovery release and verify exact readback
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 ops/transfer_clinical_backup.py store
      - name: Verify readback and acknowledge offsite copy
        run: python3 ops/transfer_clinical_backup.py acknowledge
      - name: Confirm clinical entry availability through public health
        run: python3 ops/transfer_clinical_backup.py verify
