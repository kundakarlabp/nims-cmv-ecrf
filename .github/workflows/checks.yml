name: Application checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        database: [sqlite, postgres]
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: disposable-ci-only
          POSTGRES_DB: ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci -d ci"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      DATABASE_URL: ${{ matrix.database == 'postgres' && 'postgresql+psycopg://ci:disposable-ci-only@127.0.0.1:5432/ci' || 'sqlite:////tmp/nims-ci.sqlite3' }}
      COOKIE_SECURE: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pip check
      - run: python -m pytest -q
      - run: bash -n ops/*.sh
  containers:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      POSTGRES_PASSWORD: disposable-container-ci-only
      SITE_DOMAIN: http://localhost
    steps:
      - uses: actions/checkout@v4
      - run: docker compose config --quiet
      - run: docker compose up -d --build --wait --wait-timeout 180
      - run: bash ops/check_health.sh
      - run: curl --fail --retry 5 --retry-delay 2 http://localhost/readyz
      - if: failure()
        run: docker compose logs --tail=100
      - if: always()
        run: docker compose down -v
